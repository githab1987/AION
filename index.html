<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>SPECIAL ALI — Financial Control without the noise.</title>

  <meta
    name="description"
    content="SPECIAL ALI — Financial Control Operating System"
  />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface-soft: #f2f3f5;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --blue: #0071e3;
      --green: #16a34a;
      --amber: #b7791f;
      --red: #dc2626;
      --navy: #172033;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .screen {
      min-height: 100vh;
    }

    /* --------------------------------
       Landing
    -------------------------------- */

    .landing {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fff;
    }

    .landing-nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6vw;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      width: 27px;
      height: 27px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border: 1.4px solid #111827;
      transform: rotate(45deg);
      border-radius: 4px;
    }

    .brand-mark::after {
      width: 12px;
      height: 12px;
      opacity: 0.42;
    }

    .brand-mark span {
      position: relative;
      z-index: 2;
      font-size: 7px;
      font-weight: 700;
      letter-spacing: -0.05em;
    }

    .landing-main {
      width: min(1100px, 90%);
      margin: 0 auto;
      text-align: center;
      padding: 8vh 0 5vh;
    }

    .landing-kicker {
      font-size: 14px;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: 0.02em;
      margin-bottom: 28px;
    }

    .landing-title {
      max-width: 950px;
      margin: 0 auto;
      font-size: clamp(48px, 8vw, 104px);
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-weight: 600;
    }

    .landing-subtitle {
      max-width: 640px;
      margin: 35px auto 0;
      font-size: clamp(18px, 2.2vw, 24px);
      line-height: 1.5;
      color: #6b7280;
    }

    .landing-actions {
      margin-top: 42px;
      display: flex;
      justify-content: center;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
    }

    .primary-btn {
      border: none;
      background: #111827;
      color: white;
      padding: 13px 23px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      transition: transform .2s ease, opacity .2s ease;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      opacity: .92;
    }

    .text-btn {
      border: none;
      background: transparent;
      color: #111827;
      font-size: 14px;
      font-weight: 500;
      padding: 10px;
    }

    .text-btn:hover {
      opacity: .6;
    }

    .landing-poetry {
      margin: 70px auto 0;
      max-width: 650px;
      font-size: 18px;
      line-height: 1.7;
      color: #73777f;
    }

    .landing-poetry strong {
      color: #111827;
      font-weight: 600;
    }

    .landing-footer {
      padding: 25px 6vw;
      color: #9ca3af;
      font-size: 12px;
      text-align: center;
    }

    /* --------------------------------
       Auth / onboarding
    -------------------------------- */

    .center-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px 20px;
      background: #fff;
    }

    .auth-card {
      width: min(430px, 100%);
      text-align: center;
    }

    .auth-card h1 {
      margin: 30px 0 10px;
      font-size: 34px;
      letter-spacing: -0.04em;
    }

    .auth-card p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .form {
      text-align: left;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 7px;
      color: #4b5563;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 12px 13px;
      outline: none;
      transition: border .2s ease, box-shadow .2s ease;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #9ca3af;
      box-shadow: 0 0 0 4px rgba(17, 24, 39, .05);
    }

    .full-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px;
      background: #111827;
      color: white;
      font-weight: 600;
      margin-top: 8px;
    }

    .back-link {
      border: none;
      background: transparent;
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 25px;
    }

    /* --------------------------------
       Workspace
    -------------------------------- */

    .workspace {
      min-height: 100vh;
      display: flex;
      background: var(--bg);
    }

    .sidebar {
      width: 246px;
      flex: 0 0 246px;
      background: rgba(255,255,255,.94);
      border-right: 1px solid var(--line);
      padding: 24px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      backdrop-filter: blur(20px);
    }

    .sidebar-brand {
      padding: 0 10px 27px;
    }

    .sidebar-section {
      margin-top: 23px;
    }

    .sidebar-label {
      padding: 0 10px;
      color: #9ca3af;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      margin-bottom: 7px;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: #59616e;
      font-size: 13px;
      text-align: left;
      transition: background .18s ease, color .18s ease;
    }

    .nav-item:hover {
      background: #f2f3f5;
      color: #111827;
    }

    .nav-item.active {
      background: #111827;
      color: white;
    }

    .nav-icon {
      width: 16px;
      text-align: center;
      font-size: 12px;
      opacity: .8;
    }

    .main {
      flex: 1;
      min-width: 0;
    }

    .topbar {
      height: 72px;
      border-bottom: 1px solid var(--line);
      background: rgba(247,248,250,.8);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .command-trigger {
      border: 1px solid var(--line);
      background: #fff;
      color: #6b7280;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .connection {
      font-size: 11px;
      color: #6b7280;
    }

    .connection::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
    }

    .profile-btn {
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
    }

    .avatar {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #111827;
      color: white;
      font-size: 11px;
      font-weight: 600;
    }

    .content {
      width: min(1180px, calc(100% - 64px));
      margin: 0 auto;
      padding: 48px 0 80px;
    }

    /* --------------------------------
       ALI Command Center
    -------------------------------- */

    .ali-intro {
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
      padding: 30px 0 45px;
    }

    .ali-eyebrow {
      color: #8a919b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .ali-message {
      font-size: clamp(32px, 5vw, 56px);
      line-height: 1.05;
      letter-spacing: -0.055em;
      font-weight: 600;
      min-height: 120px;
    }

    .ali-support {
      color: #737983;
      font-size: 16px;
      line-height: 1.65;
      max-width: 620px;
      margin: 22px auto 0;
    }

    .reveal {
      animation: reveal .65s cubic-bezier(.2,.7,.2,1);
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(9px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .upload-hero {
      width: min(680px, 100%);
      margin: 0 auto;
      background: white;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 42px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(17,24,39,.045);
    }

    .upload-symbol {
      width: 52px;
      height: 52px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #f2f3f5;
      display: grid;
      place-items: center;
      font-size: 23px;
    }

    .upload-hero h2 {
      font-size: 23px;
      letter-spacing: -.035em;
      margin: 0;
    }

    .upload-hero p {
      color: #7a8089;
      font-size: 14px;
      line-height: 1.6;
      margin: 10px auto 22px;
      max-width: 470px;
    }

    .formats {
      color: #9ca3af;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      margin-top: 16px;
    }

    .ask-box {
      width: min(680px, 100%);
      margin: 18px auto 0;
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 7px;
      display: flex;
      gap: 7px;
    }

    .ask-box input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      padding: 10px;
      font-size: 13px;
    }

    .ask-box button {
      border: none;
      background: #111827;
      color: white;
      border-radius: 11px;
      padding: 9px 15px;
      font-size: 12px;
      font-weight: 600;
    }

    .state-note {
      text-align: center;
      color: #9ca3af;
      font-size: 11px;
      margin-top: 20px;
    }

    /* --------------------------------
       Cards / dashboard
    -------------------------------- */

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 28px;
    }

    .breadcrumb {
      color: #9ca3af;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .page-head h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -.045em;
    }

    .page-head p {
      margin: 8px 0 0;
      color: #7a8089;
      font-size: 14px;
    }

    .back-parent {
      border: none;
      background: transparent;
      color: #6b7280;
      font-size: 12px;
      padding: 8px 0;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    .metric {
      background: white;
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 20px;
    }

    .metric-label {
      color: #8a919b;
      font-size: 11px;
    }

    .metric-value {
      margin-top: 12px;
      font-size: 27px;
      font-weight: 600;
      letter-spacing: -.04em;
    }

    .metric-meta {
      margin-top: 6px;
      color: #8a919b;
      font-size: 10px;
    }

    .panel-grid {
      display: grid;
      grid-template-columns: 1.35fr .65fr;
      gap: 18px;
    }

    .panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
    }

    .panel-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-head h3 {
      font-size: 14px;
      margin: 0;
      letter-spacing: -.02em;
    }

    .panel-body {
      padding: 20px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 0;
      border-bottom: 1px solid #f0f1f2;
    }

    .row:last-child {
      border-bottom: none;
    }

    .row-title {
      font-size: 13px;
      font-weight: 500;
    }

    .row-meta {
      font-size: 11px;
      color: #8a919b;
      margin-top: 4px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 9px;
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
    }

    .status.pass {
      background: #ecfdf3;
      color: #15803d;
    }

    .status.attention {
      background: #fff8e7;
      color: #a16207;
    }

    .status.blocked {
      background: #fef2f2;
      color: #b91c1c;
    }

    .status.info {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status.pending {
      background: #f3f4f6;
      color: #4b5563;
    }

    /* --------------------------------
       Upload / processing
    -------------------------------- */

    .processing-card {
      max-width: 820px;
      margin: 30px auto;
      background: white;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 30px;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      border-radius: 99px;
      background: #e5e7eb;
      overflow: hidden;
      margin: 22px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: #111827;
      transition: width .5s ease;
    }

    .processing-step {
      display: flex;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid #f1f2f3;
      font-size: 12px;
    }

    /* --------------------------------
       Modal
    -------------------------------- */

    .modal-layer {
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,.28);
      backdrop-filter: blur(8px);
      display: grid;
      place-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      width: min(560px, 100%);
      background: white;
      border-radius: 20px;
      border: 1px solid var(--line);
      box-shadow: 0 30px 90px rgba(0,0,0,.15);
      padding: 24px;
    }

    .modal h2 {
      margin: 0 0 8px;
      font-size: 21px;
      letter-spacing: -.03em;
    }

    .modal p {
      color: #747b84;
      font-size: 13px;
      line-height: 1.6;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 22px;
    }

    .secondary-btn {
      border: 1px solid var(--line);
      background: white;
      color: #4b5563;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 500;
    }

    /* --------------------------------
       Mobile
    -------------------------------- */

    .mobile-menu {
      display: none;
    }

    @media (max-width: 900px) {
      .sidebar {
        display: none;
      }

      .mobile-menu {
        display: block;
        border: none;
        background: transparent;
        font-size: 20px;
      }

      .content {
        width: min(100% - 34px, 700px);
        padding-top: 32px;
      }

      .topbar {
        padding: 0 17px;
      }

      .metric-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .panel-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .landing-nav {
        padding: 0 20px;
      }

      .landing-main {
        padding-top: 5vh;
      }

      .landing-poetry {
        font-size: 16px;
      }

      .upload-hero {
        padding: 30px 20px;
      }

      .ali-intro {
        padding-top: 10px;
      }

      .ali-message {
        font-size: 36px;
      }

      .metric-grid {
        grid-template-columns: 1fr 1fr;
      }

      .metric {
        padding: 15px;
      }

      .metric-value {
        font-size: 22px;
      }

      .profile-name {
        display: none;
      }

      .command-trigger {
        display: none;
      }

      .page-head {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================
       APP ROOT
  ========================================== -->

  <div id="app"></div>

  <!-- =========================================
       APP JS
  ========================================== -->

  <script src="./app.js"></script>

</body>
</html>
